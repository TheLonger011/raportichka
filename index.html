<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор оценок</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Журнал успеваемости</h1>
        <p>Оценки по дням</p>
    </div>

    <div class="controls">
        <div class="controls-left">
            <div class="control-group">
                <label>Год</label>
                <select id="yearSelect">
                    <option value="2026" selected>2026</option>
                </select>
            </div>
            <div class="control-group">
                <label>Месяц</label>
                <select id="monthSelect">
                    <option value="1">Январь</option>
                    <option value="2">Февраль</option>
                    <option value="3">Март</option>
                    <option value="4">Апрель</option>
                    <option value="5" selected>Май</option>
                    <option value="6">Июнь</option>
                </select>
            </div>
            <button onclick="loadGrades()">Обновить</button>
        </div>
        <div id="saveStatus" class="save-status"></div>
    </div>

    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
    </div>
</div>

<div id="gradeModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalStudentName"></span> - <span id="modalDate"></span>
        </div>
        <div class="modal-body">
            <div class="grade-buttons">
                <button class="grade-btn grade-btn-5" onclick="setGrade(5)">5</button>
                <button class="grade-btn grade-btn-4" onclick="setGrade(4)">4</button>
                <button class="grade-btn grade-btn-3" onclick="setGrade(3)">3</button>
                <button class="grade-btn grade-btn-2" onclick="setGrade(2)">2</button>
            </div>
            <div class="absent-buttons">
                <button class="absent-btn" onclick="setAbsent('absent')">Н</button>
                <button class="absent-btn" onclick="setAbsent('excused')">УВ</button>
                <button class="absent-btn" onclick="clearGrade()">Очистить</button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="close-btn" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
