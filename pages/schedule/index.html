<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Расписание — Журнал</title>
    <link rel="stylesheet" href="/pages/static/shared.css"/>
    <link rel="stylesheet" href="/pages/schedule/schedule.css"/>
</head>
<body>
<nav class="nav">
    <a class="nav-brand" href="/schedule"><em>журнал</em></a>
    <div class="nav-links" id="navLinks">
        <a class="nav-link active" href="/schedule">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Расписание
        </a>
    </div>
    <div class="nav-right">
        <button class="btn-sync" id="syncBtn" onclick="syncFiles()">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span class="sync-text">Обновить</span>
        </button>
        <span class="sync-status" id="syncStatus"></span>
        <button class="btn-theme" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
            <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="/logout" style="display:inline-flex;align-items:center;" title="Выйти">
            <button class="btn-theme">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </a>
    </div>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <div class="page-title">Расписание и замены</div>
        <div class="page-sub">Файлы синхронизируются автоматически каждый 1 час</div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-schedule" onclick="switchTab('schedule')">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Расписание
        </button>
        <button class="tab" id="tab-substitutions" onclick="switchTab('substitutions')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            Замены
        </button>
    </div>

    <div id="panel-schedule" class="file-panel">
        <div class="loading"><div class="spinner"></div>Загрузка...</div>
    </div>

    <div id="panel-substitutions" class="file-panel" style="display:none">
        <div class="loading"><div class="spinner"></div>Загрузка...</div>
    </div>
</div>

<script>
    (function() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateThemeIcon(localStorage.getItem('theme') || 'light');

        fetch('/api/me')
            .then(r => r.ok ? r.json() : null)
            .then(me => {
                console.log('User role from /api/me:', me?.role);

                if (!me) return;

                const navLinks = document.getElementById('navLinks');

                const scheduleLink = navLinks.querySelector('a[href="/schedule"]');

                const allLinks = navLinks.querySelectorAll('a');
                allLinks.forEach(link => {
                    if (link !== scheduleLink) {
                        link.remove();
                    }
                });

                const newLink = document.createElement('a');
                newLink.className = 'nav-link';

                if (me.role === 'teacher') {
                    newLink.href = '/';
                    newLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Группы';
                    navLinks.insertBefore(newLink, scheduleLink);
                } else if (me.role === 'student') {
                    newLink.href = '/student';
                    newLink.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Оценки';
                    navLinks.insertBefore(newLink, scheduleLink);
                }
            })
            .catch(err => {
                console.error('Failed to fetch user data:', err);
            });
    });
</script>
<script src="/pages/schedule/schedule.js"></script>
</body>
</html>
