services:
  raportichka-postgres:
    image: postgres:18.1-bookworm
    container_name: raportichka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-raportichka}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-raportichka}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - raportichka-network

  raportichka-app:
    build: .
    container_name: raportichka-app
    depends_on:
      raportichka-postgres:
        condition: service_healthy
    environment:
      STORAGE_PATH: "host=raportichka-postgres port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-raportichka} sslmode=disable"
      SCHEDULE_KEY: ${SCHEDULE_KEY}
      SUBSTITUTIONS_KEY: ${SUBSTITUTIONS_KEY}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-1}
      SEED_ON_START: ${SEED_ON_START:-true}
      TZ: Europe/Moscow
    ports:
      - "8800:8800"
    volumes:
      - ./downloads:/app/downloads
      - ./vedomost/template.xlsx:/app/vedomost/template.xlsx:ro
    restart: unless-stopped
    networks:
      - raportichka-network

volumes:
  postgres_data:
    driver: local

networks:
  raportichka-network:
    driver: bridge