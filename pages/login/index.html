<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход — Журнал</title>
    <link rel="stylesheet" href="/static/shared.css"/>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-brand {
            font-family: 'Unbounded', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: -.02em;
        }

        .login-brand em { color: var(--accent); font-style: normal; }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: var(--shadow-lg);
        }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 28px;
            background: var(--bg);
            border-radius: 12px;
            padding: 5px;
        }

        .role-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-family: 'Geologica', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }

        .role-tab svg {
            width: 22px; height: 22px;
            stroke: currentColor; fill: none;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }

        .role-tab:hover { color: var(--text); background: var(--surface); }

        .role-tab.active {
            background: var(--accent);
            color: #fff;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-field label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .form-field input,
        .form-field select {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Geologica', sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            transition: border-color .15s;
            width: 100%;
        }

        .form-field input:focus,
        .form-field select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 11px;
            font-family: 'Geologica', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: background .15s, transform .1s;
        }

        .btn-login:hover { background: #2d59d4; }
        .btn-login:active { transform: scale(.98); }
        .btn-login:disabled { background: var(--muted); cursor: not-allowed; }

        .login-error {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13.5px;
            font-weight: 600;
            margin-top: 14px;
            display: none;
        }

        [data-theme="dark"] .login-error {
            background: #450a0a;
            color: #f87171;
        }

        .login-error.show { display: block; }

        .theme-btn-wrap {
            position: fixed;
            top: 16px;
            right: 16px;
        }
    </style>
</head>
<body>
<div class="theme-btn-wrap">
    <button class="btn-theme" onclick="toggleTheme()" title="Сменить тему">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>

<div class="login-wrap">
    <div class="login-brand"><em>журнал</em></div>

    <div class="login-card">
        <div class="role-tabs">
            <button class="role-tab active" id="tabTeacher" onclick="setRole('teacher')">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Учитель
            </button>
            <button class="role-tab" id="tabStudent" onclick="setRole('student')">
                <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Ученик
            </button>
        </div>

        <div class="form-field" id="fieldGroup" style="display:none">
            <label>Группа</label>
            <select id="groupSel">
                <option value="">— выберите группу —</option>
            </select>
        </div>

        <div class="form-field">
            <label>Фамилия И.О.</label>
            <input type="text" id="fullName" placeholder="Иванова А.В." autocomplete="name"/>
        </div>

        <div class="form-field">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') doLogin()"/>
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">Войти</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<script>
    (function() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeIcon(saved);
    })();

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }

    let currentRole = 'teacher';
    let groups = [];

    fetch('/api/groups-public')
        .then(r => r.json())
        .then(data => {
            groups = data || [];
            const sel = document.getElementById('groupSel');
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                sel.appendChild(opt);
            });
        })
        .catch(() => {});

    function setRole(role) {
        currentRole = role;
        document.getElementById('tabTeacher').classList.toggle('active', role === 'teacher');
        document.getElementById('tabStudent').classList.toggle('active', role === 'student');
        document.getElementById('fieldGroup').style.display = role === 'student' ? '' : 'none';
        document.getElementById('loginError').classList.remove('show');
    }

    async function doLogin() {
        const btn = document.getElementById('btnLogin');
        const errEl = document.getElementById('loginError');
        errEl.classList.remove('show');

        const fullName = document.getElementById('fullName').value.trim();
        const password = document.getElementById('password').value;

        if (!fullName || !password) {
            showError('Заполните все поля');
            return;
        }

        const payload = { role: currentRole, full_name: fullName, password };

        if (currentRole === 'student') {
            const gid = document.getElementById('groupSel').value;
            if (!gid) { showError('Выберите группу'); return; }
            payload.group_id = +gid;
        }

        btn.disabled = true;
        btn.textContent = 'Вход...';

        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (!resp.ok) {
                showError(data.error || 'Неверные данные');
                return;
            }
            window.location.href = data.redirect;
        } catch (e) {
            showError('Ошибка соединения');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
    }

    function showError(msg) {
        const el = document.getElementById('loginError');
        el.textContent = msg;
        el.classList.add('show');
    }
</script>
</body>
</html>
