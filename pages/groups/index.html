<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Группы — Журнал</title>
    <link rel="stylesheet" href="/static/shared.css"/>
    <link rel="stylesheet" href="/pages/groups/groups.css"/>
</head>
<body>
<nav class="nav">
    <a class="nav-brand" href="/"><em>журнал</em></a>
    <div class="nav-links">
        <a class="nav-link active" href="/">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Группы
        </a>
        <a class="nav-link" href="/schedule">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Расписание
        </a>
    </div>
    <div class="nav-right">
        <span class="nav-stat" id="navStat"></span>
        <button class="btn-theme" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
            <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</nav>

<div class="page-wrap">
    <div id="view-groups">
        <div class="page-header">
            <div class="page-title">Группы</div>
            <div class="page-sub">Выберите группу для просмотра журнала</div>
        </div>
        <div class="groups-grid" id="groupsGrid">
            <div class="loading"><div class="spinner"></div>Загрузка...</div>
        </div>
    </div>

    <div id="view-subjects" style="display:none">
        <button class="btn-back" onclick="showGroups()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Все группы
        </button>
        <div class="page-header">
            <div class="page-title" id="subjPageTitle"></div>
            <div class="page-sub">Выберите предмет</div>
        </div>
        <div class="subjects-grid" id="subjectsGrid">
            <div class="loading"><div class="spinner"></div>Загрузка...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateThemeIcon(localStorage.getItem('theme') || 'light');
    });
</script>

<script>
    const _origInit = window.init;
    document.addEventListener('DOMContentLoaded', function() {
        const restoreRaw = sessionStorage.getItem('restoreGroup');
        if (!restoreRaw) return;

        const target = document.getElementById('groupsGrid');
        const observer = new MutationObserver(function(mutations, obs) {
            if (target.querySelector('.group-card')) {
                obs.disconnect();
                try {
                    const group = JSON.parse(restoreRaw);
                    sessionStorage.removeItem('restoreGroup');
                    if (typeof selectGroup === 'function') {
                        selectGroup(group.id);
                    }
                } catch(e) {}
            }
        });
        observer.observe(target, { childList: true, subtree: true });
    });
</script>
<script src="/pages/groups/groups.js"></script>
</body>
</html>
