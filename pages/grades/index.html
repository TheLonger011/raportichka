<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Журнал оценок</title>
    <link rel="stylesheet" href="/static/shared.css"/>
    <link rel="stylesheet" href="/pages/grades/grades.css"/>
</head>
<body>
<nav class="nav">
    <a class="nav-brand" href="/"><em>журнал</em></a>
    <div class="nav-links">
        <a class="nav-link" href="/">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Группы
        </a>
        <a class="nav-link" href="/schedule">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Расписание
        </a>
    </div>
    <div class="nav-right">
        <span id="saveMsg" class="save-msg"></span>
        <button class="btn-theme" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
            <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</nav>

<div class="page-wrap">
    <div class="breadcrumb">
        <span class="crumb" onclick="window.location.href='/'">Группы</span>
        <span class="sep">›</span>
        <span class="crumb" id="bcGroup" onclick="window.location.href='/'"></span>
        <span class="sep">›</span>
        <span class="cur" id="bcSubject"></span>
    </div>

    <div class="grades-controls">
        <select id="yearSel">
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
        </select>
        <select id="monthSel">
            <option value="1">Январь</option>
            <option value="2">Февраль</option>
            <option value="3">Март</option>
            <option value="4">Апрель</option>
            <option value="5" selected>Май</option>
            <option value="6">Июнь</option>
            <option value="7">Июль</option>
            <option value="8">Август</option>
            <option value="9">Сентябрь</option>
            <option value="10">Октябрь</option>
            <option value="11">Ноябрь</option>
            <option value="12">Декабрь</option>
        </select>
        <button class="btn-load" onclick="loadGrades()">Показать</button>
    </div>

    <div id="gradesWrap">
        <div class="loading"><div class="spinner"></div>Загрузка...</div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
    <div class="modal-box">
        <div class="modal-head">
            <div class="m-name" id="mName"></div>
            <div class="m-date" id="mDate"></div>
        </div>
        <div class="modal-body">
            <div class="grade-btns">
                <button class="gbtn b5" onclick="saveGrade(5)">5</button>
                <button class="gbtn b4" onclick="saveGrade(4)">4</button>
                <button class="gbtn b3" onclick="saveGrade(3)">3</button>
                <button class="gbtn b2" onclick="saveGrade(2)">2</button>
            </div>
            <div class="abs-btns">
                <button class="abtn" onclick="saveAbsent('absent')">Н</button>
                <button class="abtn" onclick="saveAbsent('excused')">УВ</button>
                <button class="abtn" onclick="clearGrade()">Очистить</button>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const theme = localStorage.getItem('theme') || 'light';
        updateThemeIcon(theme);
    });
</script>
<script src="/pages/grades/grades.js"></script>
</body>
</html>
